<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>GitHub 仓库速览 · 本机工具</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#query-form">跳转到查询表单</a>
  <main class="shell">
    <header class="hero">
      <div class="brand"><span class="brand-mark" aria-hidden="true">GH</span><span class="brand-divider">/</span> REPOSITORY EXPLORER</div>
      <div class="hero-grid">
        <div><p class="eyebrow">LOCAL DEVELOPER TOOL <span class="live-dot" aria-hidden="true"></span></p><h1>发现值得关注的<br><em>开源项目。</em></h1><p class="hero-copy">用清晰的筛选条件探索 GitHub 仓库，快速查看并导出结果。</p></div>
        <div class="hero-note" role="note"><span class="note-icon" aria-hidden="true">i</span><span>数据来自 GitHub 仓库搜索，非官方 Trending 榜单。</span></div>
      </div>
    </header>
    <section class="workspace" aria-label="仓库查询工作区">
      <aside class="query-panel"><div class="section-label">01 <span>/</span> 查询条件</div><h2>探索仓库</h2><p class="muted">设置条件后开始查询，结果将显示在查询结果区。</p>
        <form id="query-form"><fieldset><legend class="sr-only">查询筛选条件</legend>
          <label for="period">周期<select id="period" name="period"><option value="daily">每日</option><option value="weekly">每周</option><option value="monthly">每月</option></select></label>
          <label for="language">编程语言<input id="language" name="language" placeholder="例如 JavaScript" autocomplete="off"></label>
          <label for="keyword">关键词<input id="keyword" name="keyword" placeholder="搜索名称或简介" autocomplete="off"></label>
          <div class="pair"><label for="limit">数量<input id="limit" name="limit" type="number" min="1" step="1" value="10" required></label><label for="sort">排序<select id="sort" name="sort"><option value="stars">Stars</option><option value="growth">当日增长</option><option value="updated">更新时间</option></select></label></div>
          <label for="min-stars">最低 Stars<input id="min-stars" name="min-stars" type="number" min="0" step="1" placeholder="不限" aria-describedby="min-stars-hint"><span id="min-stars-hint" class="field-hint">可选，包含输入的边界值</span></label>
          <label for="date">日期<input id="date" name="date" type="date"></label>
        </fieldset><button id="submit" class="primary-button" type="submit"><span class="button-label">查询仓库</span><span class="button-arrow" aria-hidden="true">↗</span></button></form>
      </aside>
      <section class="results" aria-labelledby="results-title"><div class="result-head"><div><div class="section-label">02 <span>/</span> 查询结果</div><h2 id="results-title">结果速览 <span id="count" class="count" aria-live="polite"></span></h2></div><div class="controls"><label for="format">格式</label><select id="format"><option value="json">JSON</option><option value="table">表格</option></select><button id="download" class="secondary-button" type="button" disabled><span class="download-icon" aria-hidden="true">↓</span> 下载</button></div></div>
        <p id="status" class="status status-ready" role="status" aria-live="polite">准备就绪，设置条件并开始查询。</p><div id="cards" class="cards" aria-live="polite"></div><div class="output" aria-labelledby="output-title"><div class="output-head"><span id="output-title">格式化结果</span><span class="output-tag">OUTPUT</span></div><pre id="output" tabindex="0">等待查询结果</pre></div>
      </section>
    </section><footer><span>GITHUB REPOSITORY EXPLORER</span><span>本机运行 · 数据来自 GitHub API</span></footer>
  </main>
</body></html>
