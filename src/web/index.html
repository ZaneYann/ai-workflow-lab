<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitHub 仓库速览</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><header><div class="brand">GH <span>/</span> REPOSITORY EXPLORER</div><h1>发现值得关注的<br><em>开源项目。</em></h1><p>按条件查询 GitHub 仓库，查看并导出结果。</p><div class="notice">数据来自 GitHub 仓库搜索，非官方 Trending 榜单。</div></header>
<section class="workspace"><aside><div class="section-label">01 / 查询条件</div><h2>探索仓库</h2><p class="muted">设置条件后开始查询。</p><form id="query-form"><label>周期<select name="period"><option value="daily">每日</option><option value="weekly">每周</option><option value="monthly">每月</option></select></label><label>编程语言<input name="language" placeholder="例如 JavaScript"></label><label>关键词<input name="keyword" placeholder="搜索名称或简介"></label><div class="pair"><label>数量<input name="limit" type="number" min="1" step="1" value="10" required></label><label>排序<select name="sort"><option value="stars">Stars</option><option value="growth">当日增长</option><option value="updated">更新时间</option></select></label></div><label>最低 Stars<input name="min-stars" type="number" min="0" step="1" placeholder="不限"></label><label>日期<input name="date" type="date"></label><button id="submit" type="submit">查询仓库 <span>↗</span></button></form></aside>
<section class="results"><div class="result-head"><div><div class="section-label">02 / 查询结果</div><h2>结果速览 <span id="count"></span></h2></div><div class="controls"><label for="format">格式</label><select id="format"><option value="json">JSON</option><option value="table">表格</option></select><button id="download" type="button" disabled>下载 ↓</button></div></div><p id="status" role="status" aria-live="polite">准备就绪，设置条件并开始查询。</p><div id="cards" class="cards"></div><div class="output"><div class="output-head">格式化结果 <span>OUTPUT</span></div><pre id="output">等待查询结果</pre></div></section></section><footer>GITHUB REPOSITORY EXPLORER <span>本机运行 · 数据来自 GitHub API</span></footer></main></body></html>
